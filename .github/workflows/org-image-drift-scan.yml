# Scheduled scan of every container image published to the org's GHCR.
#
# Same reasoning as the filesystem drift scan, and more acute: a container
# image is a frozen copy of a base OS. An image built six months ago and never
# rebuilt accumulates base-layer CVEs without a single commit landing. Nothing
# in the push/PR pipeline will ever look at it again. This does.
#
# Requires org secret DRIFT_SCAN_TOKEN with package read access:
#   - classic PAT with read:packages (+ read:org), or
#   - a GitHub App installation token with Packages: Read.
# Optional: ALERT_WEBHOOK_URL.

name: Org drift scan (container images)

on:
  schedule:
    # 30 minutes after the filesystem sweep, so the two don't contend for runners.
    - cron: '47 6 * * 1'
  workflow_dispatch:
    inputs:
      severity:
        description: Severities to report.
        type: string
        default: CRITICAL,HIGH
      ignore-unfixed:
        description: Ignore vulnerabilities with no fix available.
        type: boolean
        default: true
      tags-per-package:
        description: How many of the newest tagged versions to scan per package.
        type: string
        default: '1'

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      images: ${{ steps.plan.outputs.images }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - name: List container packages
        id: plan
        env:
          GH_TOKEN: ${{ secrets.DRIFT_SCAN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          TAGS_PER_PACKAGE: ${{ inputs.tags-per-package || '1' }}
        run: |
          set -euo pipefail

          gh api "/orgs/${ORG}/packages?package_type=container&per_page=100" \
            --paginate --jq '.[].name' >packages.txt || : >packages.txt

          : >images.txt
          while read -r pkg; do
            [ -n "${pkg}" ] || continue
            # Package names can contain slashes, which must be encoded in the path.
            enc=$(jq -rn --arg s "${pkg}" '$s | @uri')
            gh api "/orgs/${ORG}/packages/container/${enc}/versions?per_page=100" --paginate \
              | jq -r --argjson n "${TAGS_PER_PACKAGE}" --arg org "${ORG}" --arg pkg "${pkg}" '
                  [ .[] | select((.metadata.container.tags | length) > 0) ]
                  | sort_by(.created_at) | reverse | .[:$n]
                  | .[] | "ghcr.io/\($org)/\($pkg):\(.metadata.container.tags[0])"
                ' >>images.txt \
              || echo "::warning title=${pkg}::could not list versions"
          done <packages.txt

          total=$(grep -c . images.txt || true)
          echo "total=${total}" >>"$GITHUB_OUTPUT"
          echo "Found ${total} images across $(grep -c . packages.txt || echo 0) packages."

          # One job per image, capped at the 256-job matrix limit.
          if [ "${total}" -gt 256 ]; then
            echo "::warning::${total} images found; scanning only the first 256 this run"
            head -n 256 images.txt >images.trimmed && mv images.trimmed images.txt
          fi
          echo "images=$(jq -R -s -c 'split("\n") | map(select(length > 0))' images.txt)" >>"$GITHUB_OUTPUT"

  scan:
    needs: discover
    if: ${{ needs.discover.outputs.total != '0' }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # Literal, not an env reference: setup-trivy only caches a pinned
          # version, and zizmor's unpinned-tools audit can't see through `env`.
          version: v0.70.0
          cache: true

      - name: Restore Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: trivy-db-

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.DRIFT_SCAN_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin

      - name: Scan image
        env:
          IMAGE: ${{ matrix.image }}
          SEVERITY: ${{ inputs.severity || 'CRITICAL,HIGH' }}
          IGNORE_UNFIXED: ${{ inputs.ignore-unfixed && '--ignore-unfixed' || '' }}
        run: |
          set -uo pipefail
          mkdir -p results
          # Slashes and colons can't go in a filename.
          safe=$(tr '/:' '__' <<<"${IMAGE}")
          trivy image --quiet --scanners vuln,secret \
            --severity "${SEVERITY}" ${IGNORE_UNFIXED} \
            --format json --output "results/${safe}.json" "${IMAGE}" \
            || echo "::warning title=${IMAGE}::trivy exited non-zero"
          # Record the mapping back to the real image reference for the report.
          printf '%s\t%s\n' "${safe}" "${IMAGE}" >"results/${safe}.name"

      - name: Upload image results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-drift-${{ strategy.job-index }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: [discover, scan]
    if: ${{ always() && needs.discover.outputs.total != '0' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download all image results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          pattern: image-drift-*
          merge-multiple: true

      - name: Build report
        id: build
        env:
          SEVERITY: ${{ inputs.severity || 'CRITICAL,HIGH' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Issues cannot be assigned to a team; mentioning it notifies every member.
          OWNER_TEAM: '@${{ github.repository_owner }}/hakai-tech-security'
        run: |
          set -euo pipefail

          : >rows.tsv
          for f in results/*.json; do
            [ -e "$f" ] || continue
            safe=$(basename "$f" .json)
            image=$(cut -f2 "results/${safe}.name" 2>/dev/null || echo "${safe}")
            counts=$(jq -c '
              [ (.Results[]?.Vulnerabilities[]? | .Severity),
                (.Results[]?.Secrets[]?         | .Severity) ]
              | { critical: (map(select(. == "CRITICAL")) | length),
                  high:     (map(select(. == "HIGH"))     | length) }' "$f" 2>/dev/null) \
              || counts='{"critical":0,"high":0}'
            c=$(jq -r '.critical' <<<"${counts}")
            h=$(jq -r '.high' <<<"${counts}")
            [ "$c" -eq 0 ] && [ "$h" -eq 0 ] && continue
            printf '%s\t%s\t%s\n' "${image}" "$c" "$h" >>rows.tsv
          done

          scanned=$(ls -1 results/*.json 2>/dev/null | wc -l | tr -d ' ')
          affected=$(grep -c . rows.tsv || true)
          crit_total=$(awk -F'\t' '{s+=$2} END {print s+0}' rows.tsv)
          high_total=$(awk -F'\t' '{s+=$3} END {print s+0}' rows.tsv)

          {
            echo "## Org drift scan — container images"
            echo
            echo "Scanned **${scanned}** images at severity \`${SEVERITY}\`."
            echo "**${affected}** have findings: **${crit_total}** critical, **${high_total}** high."
            echo
            if [ "${affected}" -gt 0 ]; then
              echo "| Image | Critical | High |"
              echo "|---|---:|---:|"
              sort -t$'\t' -k2,2nr -k3,3nr rows.tsv | while IFS=$'\t' read -r i c h; do
                echo "| \`${i}\` | ${c} | ${h} |"
              done
              echo
              echo "Most of these are fixed by rebuilding on a current base image."
            else
              echo "No findings. 🎉"
            fi
            echo
            echo "[Full logs and per-image JSON artifacts](${RUN_URL})"
            echo
            echo "---"
            echo
            echo "cc ${OWNER_TEAM} — updated in place each week, closed automatically when clean."
          } >report.md

          cat report.md >>"$GITHUB_STEP_SUMMARY"
          {
            echo "affected=${affected}"
            echo "crit_total=${crit_total}"
            echo "high_total=${high_total}"
          } >>"$GITHUB_OUTPUT"

      - name: Upsert tracking issue
        if: ${{ steps.build.outputs.affected != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create image-drift --repo "${REPO}" \
            --color D93F0B --description "Open findings from the scheduled container image scan" \
            2>/dev/null || true

          existing=$(gh issue list --repo "${REPO}" --label image-drift \
            --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --repo "${REPO}" --body-file report.md
          else
            gh issue create --repo "${REPO}" --label image-drift \
              --title "Image drift: vulnerable container images in GHCR" \
              --body-file report.md
          fi

      - name: Close the tracking issue when clean
        if: ${{ steps.build.outputs.affected == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "${REPO}" --label image-drift \
            --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue close "${existing}" --repo "${REPO}" \
              --comment "Latest image drift scan found no CRITICAL or HIGH findings."
          fi

      - name: Notify webhook
        if: ${{ steps.build.outputs.affected != '0' }}
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          AFFECTED: ${{ steps.build.outputs.affected }}
          CRIT: ${{ steps.build.outputs.crit_total }}
          HIGH: ${{ steps.build.outputs.high_total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "ALERT_WEBHOOK_URL is not set; skipping notification."
            exit 0
          fi
          payload=$(jq -n \
            --arg affected "${AFFECTED}" --arg crit "${CRIT}" \
            --arg high "${HIGH}" --arg url "${RUN_URL}" \
            '{text: "🐳 Image drift scan: \($affected) images with findings (\($crit) critical, \($high) high)\n\($url)"}')
          curl -sS --fail-with-body -X POST \
            -H 'Content-Type: application/json' \
            --data "${payload}" "${WEBHOOK_URL}"
