# Opens a quarterly issue prompting a review of who can bypass the security
# rulesets, and how often they actually did.
#
# This exists because bypass grants have no expiry. The justification for
# allowing a maintainer to merge past a red check is that someone is watching —
# an unprompted review is one nobody performs.
#
# DELIBERATELY NEEDS NO PRIVILEGED TOKEN. An earlier version read the bypass
# lists via the API and pasted them into the issue. That turned out to require
# organization Administration: **write** — GET /orgs/{org}/rulesets is a write-
# scoped endpoint, and `bypass_actors` is withheld from anyone with only read.
# A token that can read rulesets can also delete them, so keeping one in
# Actions means a workflow change in this repo could disable every security
# ruleset in the organization.
#
# Not worth it for a convenience paste. The issue links to the pages instead
# and a human reads them, which they have to do to act on it anyway.
#
# Uses only the built-in GITHUB_TOKEN.

name: Quarterly bypass review

on:
  schedule:
    # 09:13 UTC on the 1st of Jan, Apr, Jul, Oct.
    - cron: '13 9 1 1,4,7,10 *'
  workflow_dispatch:

permissions: {}

jobs:
  open-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open the review issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
          OWNER_TEAM: '@${{ github.repository_owner }}/hakai-tech-security'
        run: |
          set -euo pipefail
          gh label create bypass-review --repo "${REPO}" \
            --color 0E8A16 --description "Quarterly review of ruleset bypass actors" \
            2>/dev/null || true

          {
            echo "Quarterly check on who can bypass the security rulesets, and whether the"
            echo "set of gated repositories is still the right one."
            echo
            echo "## Look at these"
            echo
            echo "- **Rule insights** — bypass counts per repository, with CSV export:"
            echo "  ${GITHUB_SERVER_URL}/organizations/${ORG}/settings/rules/insights"
            echo "- **Rulesets** — the current bypass list on each:"
            echo "  ${GITHUB_SERVER_URL}/organizations/${ORG}/settings/rules"
            echo
            echo "## To do"
            echo
            echo "- [ ] Any \`always\` bypass actor at all? There should be none. If one was"
            echo "      added, the repo it unblocks probably should not be gated."
            echo "- [ ] Any \`Integration\` actor whose bot is retired — remove it."
            echo "- [ ] Repositories bypassing often: are they gated prematurely?"
            echo "- [ ] Re-run the direct-push audit and compare against the gate list:"
            echo "      \`ORG=${ORG} ./scripts/08-find-direct-pushers.sh\`"
            echo "- [ ] Any repo that has moved to a pull-request workflow since last"
            echo "      quarter — add it to the gate list."
            echo "- [ ] Check whether automation has moved off user accounts yet"
            echo "      (see MIGRATE-SERVICE-ACCOUNTS.md). If it has, the accounts drop out"
            echo "      of the audit and more repos become gate candidates."
            echo "- [ ] Confirm \`GHCR_READ_TOKEN\` has not expired — it is a classic PAT"
            echo "      and expiry is silent. The image sweep logs \`0 packages\` when it has."
            echo
            echo "Close this issue once reviewed. The next one opens automatically in three months."
            echo
            echo "cc ${OWNER_TEAM}"
          } >issue.md

          gh issue create --repo "${REPO}" --label bypass-review \
            --title "Quarterly bypass review" --body-file issue.md
