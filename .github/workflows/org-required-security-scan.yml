# Variant for Path A: enforced org-wide by a "Require workflows to pass before
# merging" rule in an organization ruleset. Not called by anything — the
# ruleset injects it into pull requests on every targeted repository, including
# repositories that contain no workflow files at all.
#
# Differences from security-scan-reusable.yml (Path B):
#   - `on:` is pull_request/merge_group, not workflow_call. Ruleset workflows
#     support only pull_request, pull_request_target and merge_group — there is
#     no push support, which is why Path A needs the scheduled drift scan.
#   - Any branches/paths/types filters here are IGNORED by the ruleset, so
#     there is no point listing them. Scope is set by the ruleset's target
#     branches instead.
#   - No secrets: a ruleset workflow has no caller to pass them in. Failures
#     surface on the pull request, which is where they are actionable.
#   - Inputs are hardcoded rather than parameterized, for the same reason.

name: Org security scan

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit GitHub Actions workflows with zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          min-severity: medium
          # Repositories with no workflows of their own are normal under Path A.
          fail-on-no-inputs: false
